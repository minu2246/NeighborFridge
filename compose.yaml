services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: neighbor_fridge
      POSTGRES_USER: neighbor_fridge
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - ./storage/db/postgres:/var/lib/postgresql/data
      - ./infra/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighbor_fridge -d neighbor_fridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./storage/db/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 포장지 사진 OCR (PaddleOCR, 무료). 첫 빌드는 몇 분 걸림(이미지 약 2.3GB)
  ocr:
    build: ./infra/ocr
    image: neighborfridge-ocr
    ports:
      - "8866:8866"
    volumes:
      - ./storage/cache/paddleocr:/cache
